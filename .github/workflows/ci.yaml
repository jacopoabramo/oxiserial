# Started from `maturin generate-ci github`; maintained by hand.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yaml

  build:
    name: Build Wheels
    uses: ./.github/workflows/build-wheels.yaml

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, build]
    environment: pypi
    permissions:
      # Used for PyPI trusted publishing and to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the changelog has a section for a final release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > /dev/null
          fi
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: astral-sh/setup-uv@v10.3.2
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: uv publish --trusted-publishing always 'wheels-*/*'

  # final tags only: a release candidate's entries stay in changelog.d for
  # the final release's section
  github-release:
    name: Write the GitHub release notes
    needs: release
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Write the release's notes from its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py extract "${GITHUB_REF_NAME#v}" > notes.md
          # a release published from the interface already exists; a tag pushed
          # from a clone has none yet
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
