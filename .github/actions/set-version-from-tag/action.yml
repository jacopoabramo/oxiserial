name: Set version from tag
description: Write the pushed v* tag into Cargo.toml as the package version.

runs:
  using: composite
  steps:
    - name: Set version from tag
      shell: bash
      run: |
        # PEP 440 pre-release (1.2.0rc1) -> semver (1.2.0-rc.1); maturin maps it back.
        v="$(echo "${GITHUB_REF_NAME#v}" | sed -E 's/(a|b|rc)([0-9]+)$/-\1.\2/')"
        sed -i.bak -E '/^\[package\]/,/^\[/ s/^version = ".*"/version = "'"$v"'"/' Cargo.toml
        rm Cargo.toml.bak
        cargo update --workspace
